<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade de Bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
[hidden]{display:none!important} body{margin:0}
/* Layout: marquesina de recreativa arriba, rejilla de cartuchos; vista de juego = una pantalla centrada con mandos debajo */
:root{
  --bg:#17142e; --panel:#221d45; --panel-2:#2c2659; --line:#3b3478;
  --ink:#f4efff; --muted:#a79fd6;
  --sun:#ffcf3f; --coral:#ff6f61; --teal:#35d0c6; --violet:#c46bff;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Chakra Petch',system-ui,-apple-system,sans-serif;
  --pixel:'Press Start 2P',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;
  background-image:radial-gradient(circle at 1px 1px,#ffffff10 1px,transparent 0); background-size:22px 22px;
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* Marquesina */
.marquee{display:flex;flex-direction:column;gap:10px}
.coin{font-family:var(--pixel);font-size:11px;letter-spacing:.12em;color:var(--sun);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,72px);line-height:.95;margin:0;text-wrap:balance;
  color:var(--ink);text-shadow:3px 3px 0 var(--coral),6px 6px 0 var(--violet)}
.lede{color:var(--muted);max-width:60ch;margin:0;font-size:17px}

/* Cartuchos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:18px}
.cart{--c:var(--sun);display:flex;flex-direction:column;text-align:left;padding:0;border:0;border-radius:14px;overflow:hidden;
  background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);transition:transform .15s ease,box-shadow .15s ease}
.cart:hover,.cart:focus-visible{transform:translateY(-4px);box-shadow:inset 0 0 0 3px var(--c),0 14px 30px #0006}
.thumb{display:block;width:100%;height:auto;aspect-ratio:4/3;max-width:100%;border-bottom:3px solid var(--c);background:#120f26}
.cart-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.cart-name{font-family:var(--display);font-size:21px;color:var(--c);line-height:1.1}
.cart-desc{color:var(--muted);font-size:15px;line-height:1.4;flex:1}
.cart-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13px}
.chip{font-family:var(--pixel);font-size:9px;letter-spacing:.06em;padding:6px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip b{color:var(--c);font-weight:400}
.keys{color:var(--muted)}

/* Vista de juego */
.game{display:flex;flex-direction:column;gap:18px;align-items:center}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{border:0;background:var(--panel-2);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:inset 0 0 0 2px var(--line)}
.back:hover{box-shadow:inset 0 0 0 2px var(--c,var(--sun))}
.gname{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--c,var(--sun))}
.hud{display:flex;gap:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);padding:8px 12px;border-radius:10px;min-width:84px;box-shadow:inset 0 0 0 2px var(--line)}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--pixel);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums}
#cv{display:block;max-width:100%;height:auto;border-radius:12px;border:4px solid var(--c,var(--sun));
  box-shadow:0 0 0 6px var(--panel),0 22px 50px #0008;touch-action:none;user-select:none;-webkit-user-select:none;background:#120f26}
.pad{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%;max-width:420px}
.pad:empty{display:none}
.pad.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-areas:". up ." "left down right";justify-content:center}
.pad button{min-height:56px;min-width:64px;padding:0 16px;border:0;border-radius:12px;background:var(--panel-2);
  box-shadow:inset 0 -4px 0 #0005,inset 0 0 0 2px var(--line);font-family:var(--pixel);font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0005,inset 0 0 0 2px var(--c,var(--sun))}
.pad button.wide{flex:1}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:0;max-width:56ch}
kbd{font-family:var(--pixel);font-size:10px;background:var(--panel-2);padding:3px 6px;border-radius:5px;color:var(--ink)}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.coin{animation:none}.cart{transition:none}.cart:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <section id="menu" class="wrap" style="gap:32px">
    <header class="marquee">
      <span class="coin">INSERTA MONEDA ▸ 1 CRÉDITO</span>
      <h1>Arcade de Bolsillo</h1>
      <p class="lede">Diez clásicos para jugar en el navegador, con teclado o con el dedo. Tus récords se guardan en este dispositivo.</p>
    </header>
    <div class="grid" id="grid"></div>
    <footer><kbd>P</kbd> pausa · <kbd>Esc</kbd> vuelve al menú</footer>
  </section>

  <section id="game" class="game" hidden>
    <div class="topbar">
      <button class="back" id="back">← Menú</button>
      <h2 class="gname" id="gname">Juego</h2>
      <div class="hud">
        <div class="stat"><span>Puntos</span><b id="score">0</b></div>
        <div class="stat"><span>Récord</span><b id="best">0</b></div>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div class="pad" id="pad"></div>
    <p class="hint" id="hint"></p>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const PIX = n => `${n}px "Press Start 2P", ui-monospace, monospace`;
const BODY = n => `600 ${n}px "Chakra Petch", system-ui, sans-serif`;
const C = {bg:'#17142e',deep:'#120f26',panel:'#221d45',panel2:'#2c2659',line:'#3b3478',ink:'#f4efff',muted:'#a79fd6',sun:'#ffcf3f',coral:'#ff6f61',teal:'#35d0c6',violet:'#c46bff'};
const held = new Set();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const store = {
  get(k){ try { return +localStorage.getItem('arcade:'+k) || 0 } catch(e){ return 0 } },
  set(k,v){ try { localStorage.setItem('arcade:'+k, v) } catch(e){} }
};

function label(c, txt, x, y, size, color, align='center'){
  c.font = PIX(size); c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = Math.max(3, size/2.5); c.strokeStyle = C.deep;
  c.strokeText(txt, x, y); c.fillStyle = color; c.fillText(txt, x, y);
}
function banner(c, w, h, title, lines, color){
  const bh = 64 + lines.length*22;
  c.fillStyle = 'rgba(18,15,38,.85)'; c.fillRect(0, h/2 - bh/2, w, bh);
  c.fillStyle = color; c.fillRect(0, h/2 - bh/2, w, 3); c.fillRect(0, h/2 + bh/2 - 3, w, 3);
  label(c, title, w/2, h/2 - bh/2 + 30, 18, color);
  c.font = BODY(15); c.fillStyle = C.ink; c.textAlign = 'center';
  lines.forEach((l,i) => c.fillText(l, w/2, h/2 - bh/2 + 64 + i*22));
}
function rr(c, x, y, w, h, r){
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  c.fill();
}

/* ---------- GEOMETRY DASH ---------- */
const Dash = {
  id:'dash', name:'Geometry Dash', w:480, h:300, color:'#ff5fa2', thumbY:0, tapOnDown:true,
  desc:'Salta al ritmo, esquiva los pinchos y sube a los bloques. ¿Hasta dónde llegas?', keys:'Espacio o toque',
  pad:[{a:'action', l:'Saltar', wide:true, held:1}],
  hint:'<kbd>Espacio</kbd>, <kbd>↑</kbd>, clic o toque para saltar. Mantén pulsado para encadenar saltos.',
  G:240, S:28, X:110, attempt:1,
  reset(){ Object.assign(this,{state:'ready',dist:0,y:this.G-this.S,vy:0,rot:0,ground:true,obs:[],next:620,queued:0,parts:[],t:0,score:0}) },
  demo(){
    this.reset(); this.state='play';
    this.col(200,1); this.col(230,2); this.col(260,2); this.spike(330); this.spike(360);
    this.y = this.G - this.S - 70; this.rot = .5; this.ground = false;
  },
  spike(x){ this.obs.push({k:'s', x, y:this.G-30, w:30, h:30}) },
  col(x,n){ this.obs.push({k:'b', x, y:this.G-30*n, w:30, h:30*n}) },
  gen(){
    const B = 30;
    while (this.next < this.dist + this.w + 120){
      const x = this.next, r = Math.random(), lvl = Math.min(1, this.dist/6000);
      let len;
      if (r < .25){ this.spike(x); len = B }
      else if (r < .42){ this.spike(x); this.spike(x+B); len = 2*B }
      else if (r < .52 && lvl > .15){ for (let i=0;i<3;i++) this.spike(x+i*B); len = 3*B }
      else if (r < .68){ this.col(x,1); this.col(x+B,1); this.spike(x+2*B); this.spike(x+3*B); len = 4*B }
      else if (r < .84){ this.col(x,1); this.col(x+B,2); this.col(x+2*B,2); len = 3*B }
      else { this.col(x,1); this.obs.push({k:'b', x:x+3*B, y:this.G-60, w:5*B, h:14}); for (let i=2;i<8;i++) this.spike(x+i*B); len = 8*B }
      this.next = x + len + 210 + Math.random()*170 - lvl*60;
    }
    this.obs = this.obs.filter(o => o.x + o.w > this.dist - 60);
  },
  input(a){
    if (!['action','tap','up'].includes(a)) return;
    if (this.state==='over'){ if (this.t > .5){ this.attempt++; this.reset(); this.state='play' } return }
    if (this.state==='ready') this.state='play';
    this.queued = .15;
  },
  die(){
    this.state='over'; this.t=0;
    for (let i=0;i<26;i++){ const a=Math.random()*7, s=80+Math.random()*260;
      this.parts.push({x:this.dist+this.X+this.S/2, y:this.y+this.S/2, vx:Math.cos(a)*s, vy:Math.sin(a)*s-120, life:.5+Math.random()*.4, col:i%2?C.sun:C.teal}) }
  },
  update(dt){
    for (const p of this.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 900*dt; p.life -= dt }
    this.parts = this.parts.filter(p => p.life > 0);
    if (this.state==='ready') return;
    if (this.state==='over'){ this.t += dt; return }
    const S = this.S, sp = 270 + Math.min(130, this.dist/60);
    this.dist += sp*dt; this.score = Math.floor(this.dist/50);
    this.gen();
    this.queued = Math.max(0, this.queued - dt);
    const wants = held.has('action') || held.has('up') || held.has('ptr') || this.queued > 0;
    if (this.ground && wants){ this.vy = -640; this.ground = false; this.queued = 0 }
    const prevB = this.y + S;
    this.vy += 2300*dt; this.y += this.vy*dt;
    this.ground = false;
    if (this.y + S >= this.G){ this.y = this.G - S; this.vy = 0; this.ground = true }
    const cx = this.dist + this.X;
    for (const o of this.obs){
      if (o.x > cx + S || o.x + o.w < cx) continue;
      if (o.k==='b'){
        if (cx + S > o.x + 2 && cx < o.x + o.w - 2){
          if (prevB <= o.y + 1 && this.y + S >= o.y){ this.y = o.y - S; this.vy = 0; this.ground = true }
          else if (this.y + S > o.y + 3 && this.y < o.y + o.h) return this.die();
        }
      } else if (cx + S > o.x + 9 && cx < o.x + 21 && this.y + S > o.y + 10) return this.die();
    }
    const q = Math.PI/2;
    if (this.ground){
      this.rot = Math.round(this.rot/q)*q;
      if (Math.random() < .5) this.parts.push({x:cx+2, y:this.y+S-3, vx:-60-Math.random()*60, vy:-Math.random()*60, life:.25, col:C.sun});
    } else this.rot += 5.6*dt;
  },
  draw(c){
    const W=this.w, H=this.h, G=this.G, cam=this.dist, S=this.S;
    const hue = (230 + this.dist/25) % 360;
    const g = c.createLinearGradient(0,0,0,G); g.addColorStop(0,`hsl(${hue},55%,20%)`); g.addColorStop(1,`hsl(${(hue+30)%360},60%,36%)`);
    c.fillStyle = g; c.fillRect(0,0,W,G);
    c.fillStyle = 'rgba(255,255,255,.06)';
    for (let i=0;i<8;i++){ const s = 50 + (i*37)%40, span = W+200; const x = (((i*130 - cam*.3) % span) + span) % span - 100; c.fillRect(x, 30+(i*53)%120, s, s) }
    c.fillStyle = `hsl(${hue},55%,13%)`; c.fillRect(0,G,W,H-G);
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2;
    for (let x = -(cam % 60); x < W; x += 60) c.strokeRect(x, G+2, 60, H-G);
    c.fillStyle = '#fff'; c.fillRect(0,G,W,2);
    for (const o of this.obs){
      const x = o.x - cam; if (x > W || x + o.w < 0) continue;
      if (o.k==='b'){
        c.fillStyle = C.deep; c.fillRect(x, o.y, o.w, o.h);
        c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(x+1, o.y+1, o.w-2, o.h-2);
        if (o.h > 20){ c.strokeStyle = 'rgba(255,255,255,.3)'; for (let yy=o.y; yy<o.y+o.h; yy+=30) for (let xx=x; xx<x+o.w; xx+=30) c.strokeRect(xx+7, yy+7, 16, 16) }
      } else {
        c.fillStyle = C.deep; c.beginPath(); c.moveTo(x+1, o.y+30); c.lineTo(x+15, o.y+1); c.lineTo(x+29, o.y+30); c.closePath(); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
      }
    }
    for (const p of this.parts){ c.globalAlpha = clamp(p.life*2,0,1); c.fillStyle = p.col; c.fillRect(p.x-cam-3, p.y-3, 6, 6) }
    c.globalAlpha = 1;
    if (this.state!=='over'){
      c.save(); c.translate(this.X+S/2, this.y+S/2); c.rotate(this.rot);
      c.fillStyle = C.sun; c.fillRect(-S/2,-S/2,S,S);
      c.strokeStyle = C.deep; c.lineWidth = 3; c.strokeRect(-S/2+1.5,-S/2+1.5,S-3,S-3);
      c.fillStyle = C.teal; c.fillRect(-8,-8,16,16);
      c.fillStyle = C.deep; c.fillRect(-5,-4,3,5); c.fillRect(2,-4,3,5);
      c.restore();
    }
    label(c, `INTENTO ${this.attempt}`, 14, 22, 10, '#fff', 'left');
    label(c, `${this.score} m`, W-14, 22, 12, '#fff', 'right');
    if (this.state==='ready') banner(c,W,H,'GEOMETRY DASH',['Toca o pulsa Espacio para saltar','Mantén pulsado para encadenar saltos'],'#ff5fa2');
    if (this.state==='over' && this.t > .3) banner(c,W,H,'¡CRASH!',[`${this.score} metros en el intento ${this.attempt}`,'Toca o pulsa Espacio para reintentar'],C.coral);
  }
};

/* ---------- FLAPPY ---------- */
const Flappy = {
  id:'flappy', name:'Flappy', w:360, h:540, color:C.sun, tapOnDown:true, thumbY:150,
  desc:'Aletea entre las tuberías sin tocar nada. Parece fácil.', keys:'Espacio o toque',
  pad:[{a:'action', l:'Aletear', wide:true}],
  hint:'<kbd>Espacio</kbd>, <kbd>↑</kbd>, clic o toque en la pantalla para aletear.',
  GAP:150, PW:56,
  reset(){ Object.assign(this,{y:240,v:0,pipes:[],spawn:.4,score:0,state:'ready',t:0,gx:0}) },
  demo(){ this.reset(); this.state='play'; this.score=7; this.y=250; this.v=-120;
    this.pipes=[{x:170,gy:150},{x:330,gy:210}] },
  input(a){
    if (!['action','tap','up'].includes(a)) return;
    if (this.state==='over'){ if (this.t > .6) this.reset(); return }
    this.state='play'; this.v=-360;
  },
  update(dt){
    const G = this.h - 70;
    if (this.state!=='over') this.gx = (this.gx + 150*dt) % 28;
    if (this.state==='ready'){ this.y = 240 + Math.sin(performance.now()/260)*8; return }
    this.v += 1300*dt; this.y += this.v*dt;
    if (this.state==='over'){ this.t += dt; if (this.y > G-14){ this.y = G-14; this.v = 0 } return }
    this.spawn -= dt;
    if (this.spawn <= 0){ this.spawn = 1.45; this.pipes.push({x:this.w+10, gy:60 + Math.random()*(G-60-this.GAP-50), passed:false}) }
    for (const p of this.pipes){ p.x -= 150*dt; if (!p.passed && p.x + this.PW < 90){ p.passed = true; this.score++ } }
    this.pipes = this.pipes.filter(p => p.x > -80);
    const r = 12;
    if (this.y + r > G || this.y - r < -40) return this.die();
    for (const p of this.pipes)
      if (90+r > p.x && 90-r < p.x+this.PW && (this.y-r < p.gy || this.y+r > p.gy+this.GAP)) return this.die();
  },
  die(){ this.state='over'; this.t=0; this.v=Math.min(this.v,-150) },
  pipe(c, x, y, h, top){
    if (h <= 0) return;
    c.fillStyle = '#1f9b93'; c.fillRect(x, y, this.PW, h);
    c.fillStyle = C.teal; c.fillRect(x+6, y, this.PW-18, h);
    c.fillStyle = '#9af0e9'; c.fillRect(x+10, y, 5, h);
    const cy = top ? y+h-22 : y;
    c.fillStyle = '#1f9b93'; c.fillRect(x-5, cy, this.PW+10, 22);
    c.fillStyle = C.teal; c.fillRect(x-1, cy+3, this.PW+2, 16);
  },
  draw(c){
    const W=this.w, G=this.h-70;
    const g = c.createLinearGradient(0,0,0,G); g.addColorStop(0,'#2b2370'); g.addColorStop(.65,'#7a3f8f'); g.addColorStop(1,'#ff9a76');
    c.fillStyle = g; c.fillRect(0,0,W,G);
    c.fillStyle = C.sun; c.globalAlpha=.9; c.beginPath(); c.arc(265,G-110,48,0,7); c.fill(); c.globalAlpha=1;
    c.fillStyle = '#3a2f7a';
    for (let i=0;i<12;i++){ const bh = 40 + (i*53)%80; c.fillRect(i*32-4, G-bh, 30, bh) }
    c.fillStyle = '#ffcf3f55';
    for (let i=0;i<12;i++){ const bh = 40 + (i*53)%80; for (let k=12;k<bh-6;k+=14) if ((i+k)%3) c.fillRect(i*32+4, G-bh+k, 5, 6) }
    for (const p of this.pipes){ this.pipe(c,p.x,0,p.gy,true); this.pipe(c,p.x,p.gy+this.GAP,G-p.gy-this.GAP,false) }
    c.fillStyle = '#1d1940'; c.fillRect(0,G,W,70);
    c.fillStyle = C.teal; c.fillRect(0,G,W,8);
    c.fillStyle = C.panel2; for (let x=-this.gx; x<W; x+=28) c.fillRect(x, G+20, 14, 6);
    // pájaro
    const ang = this.state==='ready' ? 0 : Math.max(-.5, Math.min(1.3, this.v/550));
    c.save(); c.translate(90,this.y); c.rotate(ang);
    c.fillStyle = C.sun; c.beginPath(); c.arc(0,0,15,0,7); c.fill();
    c.fillStyle = '#ffb02e'; c.beginPath(); c.arc(2,5,10,0,Math.PI); c.fill();
    const flap = Math.sin(performance.now()/60) * (this.state==='over'?0:5);
    c.fillStyle = '#fff3c4'; c.beginPath(); c.ellipse(-6,2+flap*.6,9,5,-.3,0,7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(6,-5,6,0,7); c.fill();
    c.fillStyle = C.deep; c.beginPath(); c.arc(8,-5,3,0,7); c.fill();
    c.fillStyle = C.coral; c.beginPath(); c.moveTo(12,0); c.lineTo(24,3); c.lineTo(12,8); c.closePath(); c.fill();
    c.restore();
    if (this.state!=='ready') label(c, String(this.score), W/2, 60, 32, '#fff');
    if (this.state==='ready') banner(c,W,this.h,'FLAPPY',['Toca o pulsa Espacio para aletear','y pasa entre las tuberías'],C.sun);

    if (this.state==='over'){ if (a==='action'||a==='tap'){ this.reset(); this.state='play' } return }

  },
  drag(x){ this.px = clamp(x-this.PW/2, 0, this.w-this.PW); if (this.stuck) this.bx = this.px+this.PW/2 },
  update(dt){

    if (held.has('left')) this.px -= 400*dt;

    this.px = clamp(this.px, 0, this.w-this.PW);
    if (this.stuck){ this.bx = this.px+this.PW/2; return }
    const n = Math.ceil(Math.hypot(this.vx,this.vy)*dt/4);
    for (let i=0;i<n;i++) if (this.step(dt/n)) break;
  },
  step(dt){
    const R = 6;
    this.bx += this.vx*dt; this.by += this.vy*dt;
    if (this.bx < R){ this.bx = R; this.vx = Math.abs(this.vx) }
    if (this.bx > this.w-R){ this.bx = this.w-R; this.vx = -Math.abs(this.vx) }
    if (this.by < R+36){ this.by = R+36; this.vy = Math.abs(this.vy) }
    if (this.vy > 0 && this.by+R >= this.PY && this.by-R <= this.PY+10 && this.bx >= this.px-R && this.bx <= this.px+this.PW+R){

    }
    for (let k=0;k<this.bricks.length;k++){
      const b = this.bricks[k];
      if (this.bx+R > b.x && this.bx-R < b.x+b.w && this.by+R > b.y && this.by-R < b.y+b.h){
        const ox = Math.min(this.bx+R-b.x, b.x+b.w-(this.bx-R)), oy = Math.min(this.by+R-b.y, b.y+b.h-(this.by-R));

        this.bricks.splice(k,1); this.score += b.pts*this.level; break;
      }
    }
    if (!this.bricks.length){ this.level++; this.build(); this.stick(); return true }
    if (this.by > this.h+10){ this.lives--; if (this.lives <= 0) this.state = 'over'; else this.stick(); return true }

    label(c, `NIVEL ${this.level}`, W-12, 18, 10, C.ink, 'right');

    if (this.state==='over') banner(c,W,H,'GAME OVER',[`${this.score} puntos · nivel ${this.level}`,'Toca o pulsa Espacio para jugar otra'],C.coral);
  }

    for (const p of this.pops){ c.globalAlpha = clamp(p.t*2,0,1); label(c, p.txt, p.x, p.y, 14, C.sun) }
    c.globalAlpha = 1;
    if (this.state==='ready') banner(c,W,H,'ATRAPA EL TOPO',['Toca los topos antes de que se escondan','Tienes 30 segundos'],'#e0a46b');
    if (this.state==='over') banner(c,W,H,'¡TIEMPO!',[`${this.score} puntos`,'Toca para jugar otra'],C.sun);
  }
};

const GAMES = {dash:Dash, flappy:Flappy, tetris:Tetris, snake:Snake, '2048':G2048, invaders:Invaders, breakout:Breakout, pong:Pong, mines:Mines, mole:Mole};

/* ---------- Gestor ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let cur = null, paused = false, last = 0, best = 0;
const dpr = Math.min(2, window.devicePixelRatio || 1);

$('#grid').innerHTML = Object.values(GAMES).map(g => `
  <button class="cart" data-game="${g.id}" style="--c:${g.color}">
    <canvas class="thumb" width="360" height="270"></canvas>
    <span class="cart-body">
      <span class="cart-name">${g.name}</span>
      <span class="cart-desc">${g.desc}</span>
      <span class="cart-meta"><span class="keys">${g.keys}</span><span class="chip">REC <b data-best="${g.id}">0</b></span></span>
    </span>
  </button>`).join('');

function drawThumbs(){
  document.querySelectorAll('.cart').forEach(card => {
    const g = GAMES[card.dataset.game], c = card.querySelector('canvas').getContext('2d');
    const s = Math.min(1, Math.max(360/g.w, 270/g.h));
    g.demo(); c.save(); c.fillStyle = C.deep; c.fillRect(0,0,360,270);
    c.scale(s,s); c.translate(0,-g.thumbY); g.draw(c); c.restore();
  });
}
function refreshBest(){ document.querySelectorAll('[data-best]').forEach(el => el.textContent = store.get(el.dataset.best)) }

function buildPad(g){
  const pad = $('#pad'); pad.innerHTML = ''; pad.className = 'pad' + (g.dpad ? ' dpad' : '');
  g.pad.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.l; el.setAttribute('aria-label', b.a); if (b.wide) el.className='wide'; if (b.area) el.style.gridArea = b.area;
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); if (b.held) held.delete(b.a) };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); if (b.held) held.add(b.a); act(b.a);
      if (b.hold){ t1 = setTimeout(() => t2 = setInterval(() => act(b.a), 70), 220) }
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, stop));
    el.addEventListener('keydown', e => { if (e.code==='Enter'){ e.preventDefault(); act(b.a) } });
    pad.appendChild(el);
  });
}

function open(id){
  const g = GAMES[id]; if (!g) return;
  cur = g; paused = false; held.clear(); g.reset(); best = store.get(g.id);
  cv.width = g.w*dpr; cv.height = g.h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  cv.style.width = `min(100%, ${(g.w/g.h*64).toFixed(1)}vh, ${g.w*1.35}px)`;
  const sec = $('#game'); sec.style.setProperty('--c', g.color);
  $('#gname').textContent = g.name; $('#hint').innerHTML = g.hint; buildPad(g);
  $('#menu').hidden = true; sec.hidden = false; window.scrollTo(0,0);
}
function close(){
  cur = null; held.clear(); $('#game').hidden = true; $('#menu').hidden = false; refreshBest();
}
function act(a){
  if (!cur) return;
  if (a==='pause'){ paused = !paused; return }
  if (paused){ paused = false; return }
  cur.input(a);
}

const KEYS = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'action',Enter:'action',KeyX:'rot',KeyP:'pause',KeyF:'flag'};
for (let i=1;i<=9;i++){ KEYS['Digit'+i] = 'n'+i; KEYS['Numpad'+i] = 'n'+i }
addEventListener('keydown', e => {
  if (!cur) return;
  if (e.code==='Escape'){ close(); return }
  const a = KEYS[e.code]; if (!a) return;
  if (e.target.closest && e.target.closest('button') && e.code==='Enter') return;
  e.preventDefault();
  held.add(a);
  if (e.repeat && !(cur.repeatOK && ['left','right','down'].includes(a))) return;
  act(a);
});
addEventListener('keyup', e => { const a = KEYS[e.code]; if (a) held.delete(a) });
addEventListener('blur', () => held.clear());

let sx=0, sy=0, st=0, down=false;
const lp = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left-cv.clientLeft)*cur.w/cv.clientWidth, (e.clientY-r.top-cv.clientTop)*cur.h/cv.clientHeight] };
cv.addEventListener('pointerdown', e => {
  if (!cur) return; e.preventDefault();
  try { cv.setPointerCapture(e.pointerId) } catch(_){}
  held.add('ptr'); down = true; sx = e.clientX; sy = e.clientY; st = performance.now();
  if (paused){ paused = false; down = false; return }
  const [x,y] = lp(e);
  if (cur.drag) cur.drag(x, y, true);
  if (cur.press){ cur.press(x, y); down = false; return }
  if (cur.tapOnDown){ act('tap'); down = false }
});
cv.addEventListener('pointermove', e => {
  if (!cur || !cur.drag) return;
  if (e.pointerType!=='mouse' && !held.has('ptr')) return;
  const [x,y] = lp(e); cur.drag(x, y, held.has('ptr'));
});
cv.addEventListener('pointerup', e => {
  held.delete('ptr');
  if (!cur || !down) return; down = false;
  const dx = e.clientX-sx, dy = e.clientY-sy;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 22){
    if (cur.click){ const [x,y] = lp(e); cur.click(x, y, {right:e.button===2, long:performance.now()-st > 450}) }
    else act('tap');
    return;
  }
  if (cur.noSwipe) return;
  const d = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
  act((cur.swipe && cur.swipe[d]) || d);
});
cv.addEventListener('pointercancel', () => { held.delete('ptr'); down = false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && cur){ paused = true; held.clear() } });

$('#back').addEventListener('click', close);
document.querySelectorAll('.cart').forEach(card => card.addEventListener('click', () => open(card.dataset.game)));

function loop(t){
  const dt = Math.min(.05, (t-last)/1000 || 0); last = t;
  if (cur){
    if (!paused) cur.update(dt);
    cur.draw(ctx);
    if (paused) banner(ctx, cur.w, cur.h, 'PAUSA', ['Pulsa P o toca para seguir'], C.sun);
    if (cur.score > best){ best = cur.score; store.set(cur.id, best) }
    $('#score').textContent = cur.score; $('#best').textContent = best;
  }
  requestAnimationFrame(loop);
}

refreshBest(); drawThumbs();
if (document.fonts) document.fonts.ready.then(drawThumbs);
const h = location.hash.slice(1); if (GAMES[h]) open(h);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
